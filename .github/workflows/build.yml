name: Build debug APK

# Builds a debug APK on every push to main, and lets you trigger it
# manually from the GitHub app/website too (Actions tab -> Run workflow).
# The resulting APK is attached as a downloadable "artifact" - no PC
# involved at any point, this all runs on GitHub's servers.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameAgent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
